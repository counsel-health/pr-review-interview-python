[project]
name = "counsel-backend"
version = "0.1.0"
description = "Counsel patient/care-team messaging API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Embedded PostgreSQL: ships real PostgreSQL binaries as a wheel so a fresh
    # checkout needs no system PostgreSQL install. See app/db.py.
    "pgembed>=0.2.0",
]

[project.scripts]
migrate = "scripts.migrate:main"
run-worker = "app.jobs.worker:main"
db-reset = "scripts.db_reset:main"
sanity-test = "scripts.sanity_test:main"
build-seed = "scripts.build_seed:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "."
warn_unreachable = true
# Alembic revisions are generated stubs with untyped `upgrade`/`downgrade`
# signatures; they are not application code.
exclude = ['(^|/)migrations/']

# pgembed synthesizes its `initdb`/`pg_ctl`/... wrappers at import time, so
# they are invisible to static analysis. Treat the package as untyped.
[[tool.mypy.overrides]]
module = ["pgembed", "pgembed.*"]
ignore_missing_imports = true
follow_imports = "skip"
